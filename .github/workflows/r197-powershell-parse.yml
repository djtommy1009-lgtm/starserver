name: R197 PowerShell syntax

on:
  push:
    branches:
      - r197-auto-ranged-single-action
    paths:
      - 'tools/*.ps1'
      - '.github/workflows/r197-powershell-parse.yml'
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath tools -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::PowerShell syntax errors"
              foreach ($errorItem in $errors) {
                Write-Host ("  line {0}, column {1}: {2}" -f `
                  $errorItem.Extent.StartLineNumber,
                  $errorItem.Extent.StartColumnNumber,
                  $errorItem.Message)
              }
            } else {
              Write-Host "PASS $($_.Name)"
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Verify R197 safety tokens
        shell: pwsh
        run: |
          $build = Get-Content -LiteralPath 'tools/R197_자동사냥_원거리단일행동_빌드.ps1' -Raw
          $apply = Get-Content -LiteralPath 'tools/R197_테스트서버_후보JAR_적용.ps1' -Raw
          $rollback = Get-Content -LiteralPath 'tools/R197_테스트서버_원복.ps1' -Raw

          $requiredBuild = @(
            'sourceAuthorityMatch',
            'productionJarModified=NO',
            'AUTO_RANGED_SINGLE_ACTION_VERSION',
            'handoffDeadAutoTarget',
            'isAutoSingleActionTargetReady',
            'settleDeadAutoTargetAfterAttack',
            'toUseElfTripleArrow(target)',
            'toWizardAttackSkill(target)'
          )
          foreach ($token in $requiredBuild) {
            if (-not $build.Contains($token)) {
              throw "Build safety token missing: $token"
            }
          }

          foreach ($text in @($apply, $rollback)) {
            if (-not $text.Contains('productionJarModified=NO')) {
              throw 'Production protection token missing.'
            }
            if (-not $text.Contains('[System.IO.File]::Replace')) {
              throw 'Atomic JAR replacement token missing.'
            }
          }

          Write-Host 'R197 safety token audit PASS'
