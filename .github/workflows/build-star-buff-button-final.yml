name: Build Star Buff Button DLL final

on:
  push:
    branches:
      - client-buff-button-dll
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify x86 DLL
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 2
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 3
          if not exist build mkdir build
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT /DUNICODE /D_UNICODE /W4 /FIwindowsx.h /FIstdlib.h /LD client\StarBuffButton\version_proxy.cpp user32.lib gdi32.lib /link /DEF:client\StarBuffButton\version.def /OUT:build\version.dll /MACHINE:X86 /INCREMENTAL:NO
          if errorlevel 1 exit /b 5
          dumpbin /headers build\version.dll > build\dumpbin_headers.txt
          dumpbin /exports build\version.dll > build\dumpbin_exports.txt
          findstr /C:"machine (x86)" build\dumpbin_headers.txt
          if errorlevel 1 exit /b 6
          findstr /C:"GetFileVersionInfoA" build\dumpbin_exports.txt
          if errorlevel 1 exit /b 7
          findstr /C:"VerQueryValueW" build\dumpbin_exports.txt
          if errorlevel 1 exit /b 8

      - name: Prepare final package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build/version.dll package/version.dll
          Copy-Item client/StarBuffButton/StarBuffButton.ini package/StarBuffButton.ini
          Copy-Item client/StarBuffButton/README_KO.txt package/README_KO.txt
          Copy-Item build/dumpbin_headers.txt package/dumpbin_headers.txt
          Copy-Item build/dumpbin_exports.txt package/dumpbin_exports.txt
          Copy-Item client/StarBuffButton/version_proxy.cpp package/version_proxy.cpp
          Copy-Item client/StarBuffButton/version.def package/version.def
          $dllHash = (Get-FileHash package/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'BUILD_STATUS=COMPILE_SUCCESS',
            'TARGET=x86',
            'RUNTIME_LIBRARY=/MT',
            'CLIENT_RUNTIME_TEST=NOT_EXECUTED',
            "VERSION_DLL_SHA256=$dllHash"
          ) | Set-Content package/BUILD_RESULT.txt -Encoding UTF8
          Get-ChildItem package | Format-Table Name,Length
          Get-Content package/BUILD_RESULT.txt

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: StarBuffButton-x86-final
          path: package/
          if-no-files-found: error
          retention-days: 30
