name: Build Star Buff Button DLL

on:
  push:
    branches:
      - client-buff-button-dll
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build x86 version proxy DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MT /DUNICODE /D_UNICODE /W4 /LD client\StarBuffButton\version_proxy.cpp user32.lib gdi32.lib /link /DEF:client\StarBuffButton\version.def /OUT:build\version.dll /MACHINE:X86 /INCREMENTAL:NO
          if errorlevel 1 exit /b 1
          dumpbin /headers build\version.dll > build\dumpbin_headers.txt
          dumpbin /exports build\version.dll > build\dumpbin_exports.txt
          findstr /C:"machine (x86)" build\dumpbin_headers.txt
          if errorlevel 1 exit /b 1
          findstr /C:"GetFileVersionInfoA" build\dumpbin_exports.txt
          if errorlevel 1 exit /b 1
          findstr /C:"VerQueryValueW" build\dumpbin_exports.txt
          if errorlevel 1 exit /b 1

      - name: Package and hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build/version.dll package/version.dll
          Copy-Item client/StarBuffButton/StarBuffButton.ini package/StarBuffButton.ini
          Copy-Item client/StarBuffButton/README_KO.txt package/README_KO.txt
          Copy-Item build/dumpbin_headers.txt package/dumpbin_headers.txt
          Copy-Item build/dumpbin_exports.txt package/dumpbin_exports.txt
          Copy-Item client/StarBuffButton/version_proxy.cpp package/version_proxy.cpp
          Copy-Item client/StarBuffButton/version.def package/version.def
          $hash = (Get-FileHash package/version.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "version.dll SHA-256=$hash" | Set-Content package/SHA256.txt -Encoding UTF8
          Compress-Archive -Path package/* -DestinationPath StarBuffButton_x86.zip -Force
          Get-ChildItem package | Format-Table Name,Length
          Get-Content package/SHA256.txt

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarBuffButton-x86
          path: StarBuffButton_x86.zip
          if-no-files-found: error
          retention-days: 30
